{% extends 'base.html' %}

{% block titulo %}Entrar · Eventos do Campus{% endblock %}

{% block conteudo %}
<div class="cartao cartao-estreito">
    <h1>Entrar</h1>
    {% if next and not user.is_authenticated %}
        <p class="texto-suave">Faça login para continuar.</p>
    {% endif %}

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_div }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
    </form>

    <p class="texto-suave">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>.</p>
</div>
{% endblock %}
