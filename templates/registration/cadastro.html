{% extends 'base.html' %}

{% block titulo %}Cadastro · Eventos do Campus{% endblock %}

{% block conteudo %}
<div class="cartao cartao-estreito">
    <h1>Criar conta</h1>
    <p class="texto-suave">Com uma conta você pode se inscrever em eventos e atividades.</p>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit">Cadastrar</button>
    </form>

    <p class="texto-suave">Já tem conta? <a href="{% url 'login' %}">Entrar</a>.</p>
</div>
{% endblock %}
